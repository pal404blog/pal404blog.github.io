name: Daily Blog

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Fetch trending topic
        shell: pwsh
        run: python scripts/fetch_topic.py > topic.json

      - name: Generate post with agy
        shell: pwsh
        env:
          AGY_BIN: "$env:LOCALAPPDATA\\agy\\bin\\agy.exe"
        run: python scripts/gen_post.py topic.json

      - name: Commit and push
        shell: pwsh
        run: |
          $remote = "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/pal404blog/pal404blog.github.io.git"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _posts posted.json
          git diff --cached --quiet || git commit -m "chore: daily blog $(Get-Date -Format yyyy-MM-dd)"
          git push $remote
